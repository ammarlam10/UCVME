# Configuration for Bayern Forest Height pixel-wise regression with UNET
# Dataset: Bayern Forest Height (RGB -> Height maps)
# Model: UNET with uncertainty estimation
# Task: Pixel-wise regression with 20% labeled data (SSL)

model:
  name: unet
  pretrained: false
  drp_p: 0.2

data:
  dataset_name: bayern_forest_height
  data_dir: /workspace/data/Bayern_forest_height_reduced
  target_column: height
  reduced_set: true  # Enable SSL
  pad_param: 5  # Padding for data augmentation
  
  # 20% labeled (2,310 samples), 80% unlabeled (9,242 samples)
  rd_label: 2310
  rd_unlabel: 9242

training:
  num_epochs: 60
  lr: 0.0001
  weight_decay: 0.001
  lr_step_period: 20
  batch_size: 16   # Reduced for 256x256 pixel-wise UNET (avoids OOM on 2x V100 32GB)
  num_workers: 6  # Use 6 workers for data loading
  seed: 0

ssl:
  ssl_mult: 3  # Repeat labeled data 3x to balance with unlabeled
  w_ulb: 10.0  # Weight for unlabeled loss (consistency regularization)
  samp_fq: 5   # MC sampling frequency for validation
  samp_ssl: 5  # MC sampling frequency for SSL

target:
  # Target normalization (height in meters)
  y_mean: 12.13  # From dataset statistics (ndsm_stats.csv)
  y_std: 10.96   # From dataset statistics (ndsm_stats.csv)

misc:
  output: output/bayern_forest_height_unet_20percent
  device: gpu
  run_test: true
  test_only: false
