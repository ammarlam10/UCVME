# Test Configuration with Percentage-Based Split
model:
  name: "resnet50"
  pretrained: true
  drp_p: 0.05

data:
  data_dir: "DATA_DIR"
  reduced_set: true
  # Test percentage-based split
  label_percentage: 0.10    # 10% labeled
  unlabel_percentage: 0.90  # 90% unlabeled
  pad_param: 5

training:
  num_epochs: 2
  lr: 0.0001
  weight_decay: 1e-3
  lr_step_period: 10
  batch_size: 128
  num_workers: 8
  seed: 0

ssl:
  ssl_mult: -1
  w_ulb: 10
  samp_fq: 3
  samp_ssl: 3

target:
  y_mean: 35
  y_std: 11

misc:
  output: "/workspace/output/test_percentage"
  device: null
  run_test: true
  test_only: false

