# So2Sat_POP Custom Configuration
# - Uses sen2spring RGB bands (2-4)
# - Train: first 90% from train directory
# - Valid: last 10% from train directory
# - Test: from test directory
# - Reduced 80% of labels where POP <= 100 on training set
# - Custom image normalization: clip [0, 4000], divide by 4000, then min-max
# - Label normalization: mean=1085, std=2800

model:
  name: "resnet50"
  pretrained: true
  drp_p: 0.05

data:
  dataset_name: "so2sat_pop_custom"
  data_dir: "/workspace/data/So2Sat_POP"
  target_column: "POP"  # Population is the target
  image_dir: "So2Sat_POP_Part1"  # Part1 contains Sentinel-2 RGB images (sen2spring)
  file_list_name: "FileList.csv"
  reduced_set: true
  # Use absolute numbers for labeled/unlabeled split
  rd_label: 1000
  rd_unlabel: 5000
  pad_param: 5

training:
  num_epochs: 30
  lr: 0.0001
  weight_decay: 1e-3
  lr_step_period: 10
  batch_size: 32
  num_workers: 4
  seed: 0

ssl:
  ssl_mult: -1
  w_ulb: 10
  samp_fq: 5
  samp_ssl: 5

target:
  # Population normalization values as specified
  y_mean: 1085.0
  y_std: 2800.0

misc:
  device: null  # null = auto-detect, or "cuda" or "cpu"
  run_test: true
  test_only: false
