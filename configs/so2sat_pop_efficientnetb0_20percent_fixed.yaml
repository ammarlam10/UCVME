# So2Sat_POP EfficientNet-B0 Configuration with 20% Supervised Training - FIXED VERSION
# Dataset: So2Sat_POP Population Estimation
# - Uses custom FileList.csv with POP <= 100 filtering (keeps 20% of low-pop samples)
# - 20% labeled, 80% unlabeled split for SSL (applied on filtered dataset)
# Model: EfficientNet-B0 from timm library
# 
# FIXES APPLIED:
# 1. Removed double normalization - only normalize in training loop
# 2. Corrected y_mean and y_std calculated from filtered training data
# 3. Fixed band extraction to use correct RGB order (indices 3,2,1)
# 4. Removed mean/std normalization, keeping only clipping and min-max
# 5. Reduced batch_size from 256 to 128
# 6. GPU configuration fix (remove CUDA_VISIBLE_DEVICES from docker command)

model:
  name: "efficientnetb0"
  pretrained: true
  drp_p: 0.05  # 5% dropout probability

data:
  dataset_name: "so2sat_pop_custom"  # Uses custom dataset with POP <= 100 filtering
  data_dir: "/workspace/data/So2Sat_POP"  # Docker path
  target_column: "POP"  # Population is the target
  image_dir: "So2Sat_POP_Part1"  # Part1 contains Sentinel-2 RGB images (sen2spring)
  file_list_name: "FileList.csv"  # Should be created by create_so2sat_pop_custom.py
  reduced_set: true
  # Use percentage-based split: 20% labeled, 80% unlabeled
  # This will automatically calculate from total training samples in filtered FileList.csv
  label_percentage: 0.20    # 20% labeled (from filtered training samples)
  unlabel_percentage: 0.80  # 80% unlabeled (from filtered training samples)
  pad_param: 5

training:
  num_epochs: 30
  lr: 0.0001
  weight_decay: 1e-3
  lr_step_period: 10
  batch_size: 64  # Reduced to 64 to avoid CUDA OOM (was 128, originally 256)
  num_workers: 2  # Reduced to 2 to free up GPU memory (was 4)
  seed: 0

ssl:
  ssl_mult: -1             # Duplicate labeled samples (multiplier = -1 means 2x duplication)
  w_ulb: 10                # Weight for unlabeled loss
  samp_fq: 5               # Sampling frequency for variational inference
  samp_ssl: 5              # Sampling frequency for SSL

target:
  # Population normalization - CORRECTED values calculated from filtered training data
  y_mean: 1872.5640   # Mean population per grid cell (calculated from FileList.csv TRAIN split)
  y_std: 3398.8516    # Standard deviation (calculated from FileList.csv TRAIN split)

misc:
  device: null  # null = auto-detect, or "cuda" or "cpu"
  run_test: true
  test_only: false
