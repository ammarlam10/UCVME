# So2Sat_POP EfficientNetB0 Configuration
model:
  name: "efficientnetb0"
  pretrained: true
  drp_p: 0.05

data:
  dataset_name: "so2sat_pop"
  data_dir: "/workspace/data/So2Sat_POP"  # Docker path (update if using different mount)
  target_column: "POP"  # Population is the target
  image_dir: "So2Sat_POP_Part1"  # Part1 contains Sentinel-2 RGB images (sen2summer)
  file_list_name: "FileList.csv"
  reduced_set: true
  # Option 1: Use absolute numbers
  rd_label: 1000
  rd_unlabel: 5000
  # Option 2: Use percentages (takes precedence over absolute numbers)
  # label_percentage: 0.10    # 10% labeled
  # unlabel_percentage: 0.50  # 50% unlabeled
  pad_param: 5

training:
  num_epochs: 30
  lr: 0.0001
  weight_decay: 1e-3
  lr_step_period: 10
  batch_size: 32
  num_workers: 4
  seed: 0

ssl:
  ssl_mult: -1
  w_ulb: 10
  samp_fq: 5
  samp_ssl: 5

target:
  # Population values - adjust based on your data statistics
  # These are example values; calculate from your training data
  y_mean: 2000.0  # Approximate mean population per grid cell
  y_std: 3000.0   # Approximate std - adjust based on actual data

misc:
  device: null  # null = auto-detect, or "cuda" or "cpu"
  run_test: true
  test_only: false

